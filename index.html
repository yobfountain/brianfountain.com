  .dt-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
  .dt-tags span{padding:4px 9px;border-radius:100px;border:1px solid rgba(239,230,218,.16);font-size:10px;color:rgba(239,230,218,.65)}

  .m-seg{display:flex;background:rgba(239,230,218,.06);border:1px solid rgba(239,230,218,.14);border-radius:100px;padding:2px}
  .m-seg button{padding:6px 11px;border-radius:100px;border:none;background:transparent;color:rgba(239,230,218,.5);

  .nav-row .btn-ghost{white-space:nowrap}
  @media (max-width:1120px){ #dPlayLabel{display:none} }
  @media (min-width:900px){ #desktop{display:flex} #mobile{display:none} }
</style>

      x:312, y:484, domains:["Art"], accent:"#c9a2ec", link:"",
      filters:["Storytelling","Games"],
      blurb:"Lincoln Center Artist Academy inductee (2013), Austin Film Festival official selection (writer), and winner of multiple story and tech hackathons. A decade of narrative and performance.",
      tags:["Writing","Film","Awards"] }
  ];
  // Card imagery: company logos, live-site screenshots, and the Run Sheldon video thumbnail.
  // ar: "square" logos render in a right-aligned square frame; "wide" images in a 16:9 frame.
  var IMG = {
    "TikTok":                        {src:"assets/logo_tiktok.png",         ar:"square", fit:"contain"},
    "General Assembly":              {src:"assets/logo_generalassembly.png",ar:"square", fit:"contain"},
    "NY Code + Design Academy":      {src:"assets/logo_nycda.png",          ar:"square", fit:"contain"},
    "Thinkful":                      {src:"assets/logo_thinkful.png",       ar:"square", fit:"contain"},
    "Adecco @ Google":               {src:"assets/logo_google.png",         ar:"square", fit:"contain"},
    "G3NPRO":                        {src:"assets/shot_g3npro.jpeg",        ar:"wide",   fit:"cover", chip:"assets/icon_g3npro.png"},
    "GenBuzz":                       {src:"assets/shot_genbuzz.jpeg",       ar:"wide",   fit:"cover", chip:"assets/icon_genbuzz.png"},
    "1K Notes":                      {src:"assets/shot_1knotes.jpeg",       ar:"wide",   fit:"cover", chip:"assets/icon_1knotes.png"},
    "Vibeside":                      {src:"assets/shot_vibeside.jpeg",      ar:"wide",   fit:"cover", chip:"assets/icon_vibeside.svg"},
    "Corn for Cars":                 {src:"assets/shot_solar.jpeg",         ar:"wide",   fit:"cover", chip:"assets/icon_solar.png"},
    "Cryptions":                     {src:"assets/shot_cryptions.jpeg",     ar:"wide",   fit:"cover", chip:"assets/icon_games.svg"},
    "Cain's Jawbone Reader":         {src:"assets/shot_cains_jawbone.jpeg", ar:"wide",   fit:"cover", chip:"assets/icon_games.svg"},
    "Cobwebs and Keys":              {src:"assets/shot_cobwebs.jpeg",       ar:"wide",   fit:"cover", chip:"assets/icon_cobwebs.png"},
    "Bee Square Games":              {src:"assets/logo_beesquare.png",      ar:"square", fit:"contain", video:"https://www.youtube.com/watch?v=12ZJwamYhY8"},
    "Mister Face":                   {src:"assets/logo_misterface.png",     ar:"square", fit:"contain"},
    "Lincoln Center Artist Academy": {src:"assets/logo_lincolncenter.svg",  ar:"square", fit:"contain"}
  };
  // Thumbnails (venn chips + timeline) always use a square representation:
  // a dedicated square chip icon when present, otherwise the (already square) logo.
  function setImg(elm,d){
    var im=IMG[d.company]; if(!im) return;
    elm.style.backgroundImage="url('"+(im.chip||im.src)+"')";
    elm.style.backgroundSize=im.chip?"cover":(im.fit||"cover");
    elm.style.backgroundPosition="center";
    elm.style.backgroundRepeat="no-repeat";
    elm.style.backgroundColor="#17130f";
  }
  var VOCAB = ["Teaching","Curriculum","Leadership","Founder","AI","Product","Code","Storytelling","Games","Music"];
  var FLOATS = ["bffloatA","bffloatB","bffloatC","bffloatD"];
  var CARD_W = 152;

  var state = { sel:0, playing:true, filter:null, view:"venn" };
  var timer = null;

  function startYear(d){ var m=(d.year||"").match(/\d{4}/); return m?+m[0]:0; }
  function matches(i){ return !state.filter || DATA[i].filters.indexOf(state.filter)!==-1; }
  function matchesItem(d){ return !state.filter || d.filters.indexOf(state.filter)!==-1; }
  function nextMatch(from){
    var n=DATA.length;
    for(var k=1;k<=n;k++){ var idx=(from+k)%n; if(matches(idx)) return idx; }
    return from;
  }
  function el(tag,cls,txt){ var e=document.createElement(tag); if(cls)e.className=cls; if(txt!=null)e.textContent=txt; return e; }

  /* ---------- tour timer ---------- */
  function restartTimer(){
    clearInterval(timer);
    timer=setInterval(function(){
      if(state.playing){ state.sel=nextMatch(state.sel); render(); }
    },3800);
  }

  /* ---------- build static node buttons once ---------- */
  var nodeEls=[];
  function buildNodes(){
    var stage=document.getElementById("dVenn");
    DATA.forEach(function(d,i){
      var wrap=el("div","node");
      var cw=d.w||CARD_W;
      wrap.style.width=cw+"px";
      wrap.style.left=(d.x-cw/2)+"px";
      wrap.style.top=(d.y-26)+"px";
      wrap.style.animation=FLOATS[i%4]+" "+(9+(i%5))+"s ease-in-out "+(-(i*1.7).toFixed(1))+"s infinite";
      var btn=el("button");
      var thumb=el("span","thumb");
      setImg(thumb,d);
      thumb.style.border="1px solid "+d.accent+"55";
      var txt=el("div","txt");
      txt.appendChild(el("span","role",d.role));
      txt.appendChild(el("span","sub",d.company+" · "+d.year));
      btn.appendChild(thumb); btn.appendChild(txt);
      btn.onclick=function(){ state.sel=i; state.playing=false; render(); };
      btn.onmouseenter=function(){ if(i!==state.sel){ btn.style.borderColor="rgba(239,230,218,.55)"; btn.style.boxShadow="0 16px 34px -10px rgba(0,0,0,.8)"; } };
      btn.onmouseleave=function(){ applyNodeStyle(i); };
      wrap.appendChild(btn);
      stage.appendChild(wrap);
      nodeEls.push({wrap:wrap,btn:btn});
    });
  }
  function applyNodeStyle(i){
    var d=DATA[i], active=(i===state.sel), dimmed=state.filter&&!matches(i);
    var w=nodeEls[i].wrap, b=nodeEls[i].btn;
    w.style.opacity=dimmed?0.16:1;
    w.style.filter=dimmed?"saturate(.3)":"none";
    w.style.pointerEvents=dimmed?"none":"auto";
    w.style.zIndex=active?45:30;
    b.style.border="1px solid "+(active?"rgba(239,230,218,.6)":"rgba(239,230,218,.16)");
    b.style.borderLeft="3px solid "+d.accent;
    b.style.background=active?"rgba(40,30,24,.96)":"rgba(24,19,16,.82)";
    b.style.backdropFilter="blur(6px)"; b.style.webkitBackdropFilter="blur(6px)";
    b.style.boxShadow=active?("0 0 0 2px "+d.accent+", 0 18px 42px -12px rgba(0,0,0,.85)"):"0 8px 22px -12px rgba(0,0,0,.7)";
    b.style.transform=active?"scale(1.08)":"scale(1)";
  }

  /* ---------- chips ---------- */
  function buildChips(container,cls){
    container.innerHTML="";
    VOCAB.forEach(function(t){
      var c=el("button",cls,t);
      c.dataset.tag=t;
      c.onclick=function(){
        state.filter=(state.filter===t)?null:t;
        if(!matches(state.sel)) state.sel=nextMatch(state.sel);
        state.playing=false; render();
      };
      container.appendChild(c);
    });
  }

  /* ---------- timeline rows ---------- */
  function buildTimeline(container,opts){
    container.innerHTML="";
    var sorted=DATA.slice().sort(function(a,b){ return startYear(b)-startYear(a); });
    sorted.filter(matchesItem).forEach(function(d){
      var row=el("div",opts.row);
      var yr=el("div",opts.year,String(startYear(d)));
      var dot=el("div",opts.dot); dot.style.background=d.accent;
      var card=el("div",opts.card); card.style.borderLeft="3px solid "+d.accent;
      if(opts.thumb){
        var th=el("div",opts.thumb);
        setImg(th,d);
        th.style.border="1px solid "+d.accent+"55";
        card.appendChild(th);
      }
      var body=el("div"); body.style.flex="1"; body.style.minWidth="0";
      body.appendChild(el("div",opts.role,d.role));
      var sub=el("div",opts.sub,d.company+" · "+d.year); sub.style.color=d.accent;
      body.appendChild(sub);
      body.appendChild(el("div",opts.blurb,d.blurb));
      if(opts.tags){
        var tg=el("div",opts.tags);
        d.tags.forEach(function(t){ tg.appendChild(el("span",null,t)); });
        body.appendChild(tg);
      }
      card.appendChild(body);
      row.appendChild(yr); row.appendChild(dot); row.appendChild(card);
      container.appendChild(row);
    });
  }

  /* ---------- render ---------- */
  function render(){
    var d=DATA[state.sel];

    // desktop view toggle
    var isVenn=state.view==="venn";
    document.getElementById("dViewVenn").classList.toggle("on",isVenn);
    document.getElementById("dViewTl").classList.toggle("on",!isVenn);
    document.getElementById("dStageMid").style.display=isVenn?"flex":"none";
    document.getElementById("dPanel").style.display=isVenn?"flex":"none";
    document.getElementById("dPlay").style.display=isVenn?"flex":"none";
    document.getElementById("dTimeline").style.display=isVenn?"none":"flex";

    // nodes
    for(var i=0;i<DATA.length;i++) applyNodeStyle(i);

    // chips (both)
    document.querySelectorAll("#dChips .chip").forEach(function(c){ c.classList.toggle("on",c.dataset.tag===state.filter); });
    document.querySelectorAll("#mChips .m-chip").forEach(function(c){ c.classList.toggle("on",c.dataset.tag===state.filter); });
    document.getElementById("dClear").style.opacity=state.filter?1:0.35;

    // panel
    var prev=document.getElementById("dPreview"), im=IMG[d.company]||{};
    prev.className="preview "+(im.ar==="square"?"ar-square":"ar-wide");
    prev.style.backgroundImage=im.src?("url('"+im.src+"')"):"none";
    prev.style.backgroundSize=im.fit||"cover";
    prev.style.backgroundPosition="center";
    prev.style.backgroundRepeat="no-repeat";
    var openUrl=im.video||(d.link?("https://"+d.link):"");
    prev.onclick=openUrl?function(){window.open(openUrl,"_blank","noopener");}:null;
    prev.style.cursor=openUrl?"pointer":"default";
    var pd=document.getElementById("pDomains"); pd.textContent=d.domains.join("  +  ").toUpperCase(); pd.style.color=d.accent;
    document.getElementById("pRole").textContent=d.role;
    var pc=document.getElementById("pCompany"); pc.textContent=d.company; pc.style.color=d.accent;
    document.getElementById("pYear").textContent=d.year;
    document.getElementById("pBlurb").textContent=d.blurb;
    var pt=document.getElementById("pTags"); pt.innerHTML=""; d.tags.forEach(function(t){ pt.appendChild(el("span",null,t)); });
    document.getElementById("pCounter").textContent=String(state.sel+1).padStart(2,"0")+" / "+String(DATA.length).padStart(2,"0");
    var lk=document.getElementById("pLink");
    if(d.link){ lk.style.display="block"; lk.textContent=d.link+" ↗"; lk.href="https://"+d.link; lk.style.color=d.accent; }
    else lk.style.display="none";

    // play button
    document.getElementById("dPlayIcon").textContent=state.playing?"❚❚":"▶";
    document.getElementById("dPlayLabel").textContent=state.playing?"PAUSE":"PLAY";

    // desktop timeline
    if(!isVenn) buildTimeline(document.getElementById("dtRows"),
      {row:"dt-row",year:"dt-year",dot:"dt-dot",card:"dt-card",thumb:"dt-thumb",role:"dt-role",sub:"dt-sub",blurb:"dt-blurb",tags:"dt-tags"});

    renderMobile();
  }

  /* ---------- mobile ---------- */
  function renderMobile(){
    var scroll=document.getElementById("mScroll");
    var mVenn=state.view==="venn";
    document.getElementById("mViewVenn").classList.toggle("on",mVenn);
    document.getElementById("mViewTl").classList.toggle("on",!mVenn);
    scroll.innerHTML="";
    if(!mVenn){
      var tl=el("div","m-tl");
      var container=el("div"); tl.appendChild(el("div","m-line"));
      buildTimeline(container,{row:"m-row",year:"m-year",dot:"m-dot",card:"m-card",thumb:"m-thumb",role:"m-role",sub:"m-sub",blurb:"m-blurb",tags:"m-tags"});
      while(container.firstChild) tl.appendChild(container.firstChild);
      scroll.appendChild(tl);
    } else {
      var wrap=el("div","m-venn");
      wrap.appendChild(el("div","m-venn-note","EDUCATION · TECHNOLOGY · ART — TAP TO EXPLORE"));
      DATA.forEach(function(d){
        if(!matchesItem(d)) return;
        var c=el("div","m-vcard"); c.style.borderLeft="3px solid "+d.accent;
        var th=el("div","m-vthumb");
        setImg(th,d);
        th.style.border="1px solid "+d.accent+"55";
        var body=el("div"); body.style.minWidth="0";
        body.appendChild(el("div","m-vrole",d.role));
        var sub=el("div","m-vsub",d.company+" · "+d.year); sub.style.color=d.accent;
        body.appendChild(sub);
        c.appendChild(th); c.appendChild(body);
        wrap.appendChild(c);
      });
      scroll.appendChild(wrap);
    }
  }

  /* ---------- scaler ---------- */
  function scaleStage(){
    var d=document.getElementById("desktop");
    if(getComputedStyle(d).display==="none") return;
    var mid=document.getElementById("dStageMid");
    var stage=document.getElementById("dVenn");
    if(!mid||!stage||mid.clientHeight===0) return;
    var availW=mid.clientWidth-48, availH=mid.clientHeight-32;
    var s=Math.min(availW/1260, availH/600);
    s=Math.max(0.45, Math.min(s, 1.35));
    stage.style.transform="scale("+s+")";
  }

  /* ---------- wire events ---------- */
  function init(){
    // Land on the Timeline (3a) on phones; Venn (2a) on desktop.
    state.view = window.matchMedia("(min-width:900px)").matches ? "venn" : "timeline";
    buildNodes();
    buildChips(document.getElementById("dChips"),"chip");
    buildChips(document.getElementById("mChips"),"m-chip");

    document.getElementById("dViewVenn").onclick=function(){ state.view="venn"; render(); scaleStage(); };
    document.getElementById("dViewTl").onclick=function(){ state.view="timeline"; render(); scaleStage(); };
    document.getElementById("mViewVenn").onclick=function(){ state.view="venn"; render(); };
    document.getElementById("mViewTl").onclick=function(){ state.view="timeline"; render(); };
    document.getElementById("dPlay").onclick=function(){ state.playing=!state.playing; render(); };
    document.getElementById("dClear").onclick=function(){ state.filter=null; state.playing=false; render(); };

    render();
    restartTimer();
    scaleStage();
    window.addEventListener("resize",scaleStage);
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",init);
  else init();
})();
</script>
