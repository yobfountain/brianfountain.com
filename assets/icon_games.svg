<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bender">
  <!-- theme background -->
  <rect x="0" y="0" width="64" height="64" rx="13" fill="#f6efe1"/>
  <!-- board container -->
  <rect x="8" y="8" width="48" height="48" rx="11" fill="#efe4d2" stroke="#e7dac4" stroke-width="1"/>
  <!-- four tiles (2x2), each with a 2px bottom shadow -->
  <!-- top-left: green -->
  <rect x="14" y="15" width="16" height="16" rx="4" fill="#667a4f"/>
  <rect x="14" y="13" width="16" height="16" rx="4" fill="#7e9464"/>
  <!-- top-right: blue -->
  <rect x="34" y="15" width="16" height="16" rx="4" fill="#57718a"/>
  <rect x="34" y="13" width="16" height="16" rx="4" fill="#6f8ba3"/>
  <!-- bottom-left: orange -->
  <rect x="14" y="35" width="16" height="16" rx="4" fill="#a85a3a"/>
  <rect x="14" y="33" width="16" height="16" rx="4" fill="#c9734e"/>
  <!-- bottom-right: purple -->
  <rect x="34" y="35" width="16" height="16" rx="4" fill="#7a627c"/>
  <rect x="34" y="33" width="16" height="16" rx="4" fill="#937995"/>
</svg>
